name: Daily master_df Update

on:
  schedule:
    - cron: '0 23 * * 1-5'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test network
        run: |
          curl -I https://pypi.org || echo "PyPI unreachable"
          python -m pip install --upgrade pip

      - name: Install core packages
        run: pip install yfinance pandas numpy fredapi newsapi-python python-dotenv

      - name: Install ML packages
        run: |
          pip install transformers
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Verify installs
        run: |
          python -c "import yfinance; print('yfinance', yfinance.__version__)"
          python -c "import pandas; print('pandas', pandas.__version__)"

      - name: Run daily update
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NEWSAPI_KEY:  ${{ secrets.NEWSAPI_KEY }}
        run: python scripts/update_master_df.py

      - name: Validate CSV before publishing
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          path = Path("data/processed/master_df.csv")
          df = pd.read_csv(path, parse_dates=["date"]).sort_values("date")
          assert not df["date"].duplicated().any(), "Duplicate dates"
          assert df["vix"].notna().all() and (df["vix"] > 0).all(), "Invalid VIX"
          assert df["date"].is_monotonic_increasing, "Unsorted dates"
          print(f"Validated {len(df)} rows; latest={df['date'].max().date()}")
          PY

      - name: Detect dataset changes
        id: changes
        run: |
          if git diff --quiet -- data/processed/master_df.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Dataset unchanged"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Dataset changed"
          fi

      - name: Save CSV to GitHub main
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/master_df.csv
          git commit -m "chore(data): reconcile VIX history $(date -u '+%Y-%m-%d')"
          git push origin HEAD:main

      - name: Publish CSV to Hugging Face without overwriting other files
        if: steps.changes.outputs.changed == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN" || { echo "HF_TOKEN is missing"; exit 1; }
          python -m pip install huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_file(
              path_or_fileobj="data/processed/master_df.csv",
              path_in_repo="data/processed/master_df.csv",
              repo_id="SabinaLucy/volarix",
              repo_type="space",
              commit_message="chore(data): update master_df trading history",
          )
          print("Uploaded master_df.csv to Hugging Face Space")
          PY

      - name: Restart Hugging Face Space
        if: steps.changes.outputs.changed == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN"
          curl --fail-with-body --show-error --silent \
            --retry 3 -X POST \
            "https://huggingface.co/api/spaces/SabinaLucy/volarix/restart" \
            -H "Authorization: Bearer $HF_TOKEN"
